<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>

    <h1>Calculadora</h1>

    <input type="number" id="numero1" placeholder="Primeiro numero">

    <select id="operacao"> 
        <option value="+">+</option> 
        <option value="-">-</option> 
        <option value="*">×</option> 
        <option value="%">%</option> 
    </select>
    
    <input type="number" id="numero2" placeholder="Segundo número"> 
    
    <button onclick="calcular()">Calcular</button> 

    <button onclick="limpar()">Limpar</button>
    
    <h2 id="resultado"></h2> 
    
    <script src="script.js"></script> 

</body> 
</html>
